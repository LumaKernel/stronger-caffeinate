name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Package binary
        run: |
          tar czf stronger-caffeinate-${{ github.ref_name }}-darwin-arm64.tar.gz \
            -C .build/release stronger-caffeinate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: stronger-caffeinate-*.tar.gz
          generate_release_notes: true
